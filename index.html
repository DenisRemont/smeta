<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Смета</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand" id="brand">Смета</div>
  <button class="link" id="reset" type="button">Новая смета</button>
</header>

<main>
  <section class="card client">
    <label>Клиент
      <input id="client" type="text" autocomplete="off" placeholder="Имя или организация">
    </label>
    <label>Объект
      <input id="address" type="text" autocomplete="off" placeholder="Адрес">
    </label>
    <div class="doc-type" id="docType">
      <button type="button">Смета</button>
      <button type="button">Акт</button>
    </div>
  </section>

  <nav class="rooms" id="rooms"></nav>

  <section class="card room" id="room"></section>

  <div class="filters">
    <input id="search" class="search" type="search" placeholder="Поиск работы">
    <label class="only"><input id="only" type="checkbox"> Только выбранные</label>
  </div>

  <div id="status" class="status"></div>
  <div id="sections"></div>
</main>

<footer class="bar">
  <div class="total">
    <span id="roomTotal">Комната: 0 ₽</span>
    <strong id="total">0 ₽</strong>
  </div>
  <button id="pdf" type="button" disabled>Скачать PDF</button>
</footer>

<script src="config.js"></script>
<script src="vendor/pdfmake.min.js" defer></script>
<script src="vendor/vfs_fonts.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
